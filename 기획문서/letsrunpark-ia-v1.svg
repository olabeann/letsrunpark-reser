<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1190" viewBox="0 0 1720 1190" role="img" aria-labelledby="title desc"><title id="title">렛츠런파크 통합 예약·결제 시스템 전체 IA</title><desc id="desc">이용자 예약과 예약 조회, 고객사 운영 관리자와 그 하위 계정·권한 메뉴별 메뉴 및 하위 화면 구조. 현재 프로토타입 기준이며 준비 중 지역과 외부 연동 필요 항목을 구분한다.</desc><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#17332f}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536761}.head{font-size:23px;font-weight:700}.node{font-size:20px;font-weight:700}.detail{font-size:17px;fill:#435c55}.line{stroke:#aec4bc;stroke-width:2;fill:none}</style><rect width="1720" height="1190" fill="#ffffff"/><text x="48" y="60" class="title">렛츠런파크 통합 예약·결제 시스템</text><text x="48" y="94" class="sub">전체 IA · 현재 폴더의 화면 구조 기준 · v1.1 · 2026.09.16</text><rect x="610" y="122" width="500" height="56" rx="8" fill="#173f36"/><text x="860" y="158" text-anchor="middle" style="fill:white;font-size:23px;font-weight:700">통합 예약·결제 서비스</text><path class="line" d="M860 178V200M312 200H1408"/><path class="line" d="M312 200V220"/><rect x="48" y="220" width="528" height="88" rx="8" fill="#e9f3ee"/><text x="66" y="255" class="head">01  이용자 · 예약</text><text x="66" y="286" class="sub">서울 중심의 현재 예약 흐름</text><path class="line" d="M58 308V364H73"/><rect x="73" y="336" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="88" y="365" class="node">지역 선택</text><text x="88" y="391" class="detail">서울 / 부산경남·제주 [준비 중]</text><path class="line" d="M58 387V477H73"/><rect x="73" y="449" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="88" y="478" class="node">체험 예약</text><text x="88" y="504" class="detail">포니 타기 · 포니랑 놀기</text><text x="88" y="528" class="detail">날짜 → 회차 → 인원·할인</text><path class="line" d="M58 500V590H73"/><rect x="73" y="562" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="88" y="591" class="node">간편로그인</text><text x="88" y="617" class="detail">카카오 / 네이버</text><path class="line" d="M58 613V703H73"/><rect x="73" y="675" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="88" y="704" class="node">장바구니</text><text x="88" y="730" class="detail">담은 티켓 · 삭제 · 다른 체험 추가</text><path class="line" d="M58 726V816H73"/><rect x="73" y="788" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="88" y="817" class="node">주문·결제</text><text x="88" y="843" class="detail">예약 내용 · 결제 정보 → 예약 완료</text><path class="line" d="M860 200V220"/><rect x="596" y="220" width="528" height="88" rx="8" fill="#e9f3ee"/><text x="614" y="255" class="head">02  이용자 · 예약 조회</text><text x="614" y="286" class="sub">로그인 회원 전용</text><path class="line" d="M606 308V364H621"/><rect x="621" y="336" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="636" y="365" class="node">예약 티켓 목록</text><text x="636" y="391" class="detail">예약·결제 내역 · 티켓 선택</text><path class="line" d="M606 387V477H621"/><rect x="621" y="449" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="636" y="478" class="node">티켓 상세</text><text x="636" y="504" class="detail">프로그램 · 날짜·회차 · 인원</text><text x="636" y="528" class="detail">예약번호 · 입장 상태 · 할인 증빙</text><path class="line" d="M606 500V590H621"/><rect x="621" y="562" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="636" y="591" class="node">취소·환불</text><text x="636" y="617" class="detail">취소 인원 선택 · 환불 금액 확인</text><text x="636" y="641" class="detail">부분·전체 취소 · 처리 내역</text><path class="line" d="M606 613V703H621"/><rect x="621" y="675" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="636" y="704" class="node">회원 관리</text><text x="636" y="730" class="detail">로그아웃 / 회원탈퇴 확인</text><path class="line" d="M606 726V816H621"/><rect x="621" y="788" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="636" y="817" class="node">공통 예외 화면</text><text x="636" y="843" class="detail">결제 실패 · 시스템 오류</text><text x="636" y="867" class="detail">빈 상태 · 판매 마감 · 수량 제한</text><path class="line" d="M1408 200V220"/><rect x="1144" y="220" width="528" height="88" rx="8" fill="#e9f3ee"/><text x="1162" y="255" class="head">03  고객사 운영 관리자</text><text x="1162" y="286" class="sub">부서 계정 / 통합 관리자 로그인</text><path class="line" d="M1154 308V364H1169"/><rect x="1169" y="336" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="1184" y="365" class="node">예약 · 티켓</text><text x="1184" y="391" class="detail">목록·검색 → 예약 상세·개별 티켓</text><text x="1184" y="415" class="detail">결제 상세 · 선택 취소·부분환불</text><path class="line" d="M1154 387V477H1169"/><rect x="1169" y="449" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="1184" y="478" class="node">프로그램 · 회차</text><text x="1184" y="504" class="detail">목록 → 프로그램 등록·수정·삭제</text><text x="1184" y="528" class="detail">반복 회차 → 등록·수정·판매 관리</text><path class="line" d="M1154 500V590H1169"/><rect x="1169" y="562" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="1184" y="591" class="node">할인 관리 [프로그램 하위]</text><text x="1184" y="617" class="detail">정률·정액 · 적용 조건</text><text x="1184" y="641" class="detail">프로그램별 할인 연결</text><path class="line" d="M1154 613V703H1169"/><rect x="1169" y="675" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="1184" y="704" class="node">운영일 관리</text><text x="1184" y="730" class="detail">월별 달력 → 날짜별 프로그램</text><text x="1184" y="754" class="detail">휴장·운영 취소 확인</text><path class="line" d="M1154 726V816H1169"/><rect x="1169" y="788" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="1184" y="817" class="node">매출 · 정산</text><text x="1184" y="843" class="detail">결제·정산 원장 → 거래 상세</text><text x="1184" y="867" class="detail">지역·부서·상품 요약 · 엑셀</text><path class="line" d="M1154 839V929H1169"/><rect x="1169" y="901" width="503" height="94" rx="6" fill="#f7faf8" stroke="#d7e3dd"/><text x="1184" y="930" class="node">계정 · 권한 [통합 관리자 전용]</text><text x="1184" y="956" class="detail">계정 목록·발급·수정 · 비밀번호 재발급</text><text x="1184" y="980" class="detail">이용 범위 안내 · 계정 삭제·제한</text><line x1="48" y1="1042" x2="1672" y2="1042" stroke="#d7e3dd"/><text x="48" y="1080" class="detail">읽는 법  ─  연결선은 정보의 소속 관계이며, 카드 내부의 →는 주요 화면 이동을 나타냅니다.</text><text x="48" y="1114" class="detail">현재 화면은 프론트엔드 프로토타입입니다. 실제 로그인·결제·환불·서버 권한은 연동이 필요하며 고객 자동 알림은 미발송입니다.</text><text x="48" y="1148" class="detail">할인 관리는 독립 상위 메뉴가 아닌 프로그램 하위 기능이며, 계정·권한은 통합 관리자에게만 노출됩니다.</text></svg>